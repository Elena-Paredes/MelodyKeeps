<main class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blush via-lavender to-peach px-4">
  <div class="w-full max-w-sm rounded-3xl bg-white/80 backdrop-blur-sm shadow-xl shadow-violet/20 p-8">
    <div class="flex flex-col items-center mb-8">
      <div class="h-14 w-14 rounded-2xl bg-gradient-to-br from-accent to-violet flex items-center justify-center mb-3 shadow-lg shadow-accent/30">
        <span class="text-2xl">🎵</span>
      </div>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-accent to-violet bg-clip-text text-transparent">
        MelodyKeeps
      </h1>
      <p class="text-sm text-plum/60 mt-1">Convierte tu canción en un recuerdo</p>
    </div>

    <form class="flex flex-col gap-4" (submit)="onSubmit($event)">
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-sm font-medium text-plum">Correo</label>
        <input
          id="email"
          type="email"
          placeholder="tú@correo.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          class="rounded-xl border border-violet/20 bg-babyblue/30 px-4 py-2.5 text-plum placeholder:text-plum/40 outline-none focus:ring-2 focus:ring-accent/50"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-sm font-medium text-plum">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          class="rounded-xl border border-violet/20 bg-babyblue/30 px-4 py-2.5 text-plum placeholder:text-plum/40 outline-none focus:ring-2 focus:ring-accent/50"
        />
      </div>

      @if (error()) {
        <p class="text-sm text-red-500 text-center">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="mt-2 rounded-xl bg-gradient-to-r from-accent to-accent-dark text-white font-semibold py-2.5 shadow-md shadow-accent/30 hover:opacity-90 transition disabled:opacity-50"
      >
        {{ loading() ? 'Entrando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="text-center text-sm text-plum/60 mt-6">
      ¿No tienes cuenta?
      <a href="#" class="text-violet font-medium hover:underline">Regístrate</a>
    </p>
  </div>
</main>
